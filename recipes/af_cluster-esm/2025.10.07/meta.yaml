{% set name = "af_cluster-esm" %}
{% set version = "2025.10.07" %}
{% set commit = "6b22451c5a9def576f43824bb5573a9c1faf6c55" %}
{% set sha256 = "06b4b5ec496db05b3a81e4e1c41e883a8470d078232dbfe9ec85eee088b51112" %}
{% set esm_variant = esm_variant or "cuda" %}
 
package:
  name: {{ name|lower }}
  version: {{ version }}
 
 
source:
  - url: https://github.com/HWaymentSteele/AF_Cluster/archive/{{ commit }}.tar.gz
    sha256: {{ sha256 }}
    folder: af_cluster
 
build:
  number: 0
  string: {{ esm_variant }}_py{{ py }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  run_exports:
    -  {{ pin_subpackage( name|lower, max_pin="x") }}
 
 
requirements:
  host:
    - python
  run:
    - python
    - af_cluster {{ version }}
    - pytorch >=2.0
    - pytorch * cuda*  # [esm_variant == "cuda"]
    - pytorch * cpu*   # [esm_variant == "cpu"]
    - fair-esm >=2.0.0
    - biotite
    - biopython
    - matplotlib-base
    - numpy
    - pandas
    - scipy
    - tqdm
    - pandarallel
 
test:
  commands:
    - runESM.py --help
    - python -c "import esm; print(esm.__version__)"
    - python -c "import torch; print(torch.__version__)"
    - ClusterMSA.py --help
 
about:
  home: https://github.com/HWaymentSteele/AF_Cluster
  license: MIT
  license_file: af_cluster/LICENSE
  summary: ESM contact-map prediction for AF-Cluster sub-MSAs (runESM.py).
  description: |
    Installs runESM.py, which predicts residue contact maps for AF-Cluster
    sub-MSAs using ESM-1b or the MSA Transformer (default: msa_t).
extra:
  skip-lints:
    - should_be_noarch_generic
