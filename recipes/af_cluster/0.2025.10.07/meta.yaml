{% set name = "af_cluster" %}
{% set version = "0.2025.10.07" %}
{% set commit = "6b22451c5a9def576f43824bb5573a9c1faf6c55" %}
{% set sha256 = "06b4b5ec496db05b3a81e4e1c41e883a8470d078232dbfe9ec85eee088b51112" %}
{% set af_cluster_variant = af_cluster_variant | default("cuda") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/HWaymentSteele/AF_Cluster/archive/{{ commit }}.tar.gz
    sha256: {{ sha256 }}
    patches:
      - add-shebangs.patch
      - fix-colabfold-predict-api.patch

build:
  noarch: python
  number: 0
  string: {{ af_cluster_variant }}_py{{ py }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  run_exports:
    - {{ pin_subpackage(name|lower, max_pin="x.x") }}

requirements:
  host:
    - python
  run:
    - python
    - biopython
    - matplotlib-base
    - mdtraj
    - numpy
    - pandas
    - pandarallel
    - polyleven
    - scikit-learn
    - seaborn
    - scipy
    - tqdm
    - biotite
    - pytorch * cuda*  # [af_cluster_variant == "cuda"]
    - pytorch * cpu*   # [af_cluster_variant == "cpu"]
    - jaxlib * cuda*   # [af_cluster_variant == "cuda"]
    - jaxlib * cpu*    # [af_cluster_variant == "cpu"]
    - cuda-version 12.*
    - colabfold >=1.5.5
    - fair-esm >=2.0.0
    - dm-haiku <=0.0.12

test:
  commands:
    - ClusterMSA.py --help
    - CalculateModelFeatures.py --help
    - runESM.py --help
    - RunAF2.py --help
  imports:
    - alphafold.model.model
    - alphafold.model.config
    - alphafold.model.data
    - esm
    - torch
    - jax

about:
  home: https://github.com/HWaymentSteele/AF_Cluster
  license: MIT
  license_file: LICENSE
  summary: Predict multiple protein conformations via MSA sequence clustering (AF-Cluster).
  description: |
    Commands: ClusterMSA.py, CalculateModelFeatures.py,
    get_PCA_embedding.py, RunAF2.py, runESM.py

    RunAF2.py needs AlphaFold2 parameters (not included).
    Pass --af2_dir pointing at a directory where
    <af2_dir>/data/params/params_model_1_ptm.npz exists.
